name: Test and build Meshbot

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.21.x' ]

    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Run tests
        run: make test

  build:
    name: Build binaries
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.21.x' ]

    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Build the application
        run: make build
      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: meshbot-linux
          path: ./dist/linux/*
      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: meshbot-windows
          path: ./dist/windows/*
      - name: Upload Raspberry Pi binary
        uses: actions/upload-artifact@v4
        with:
          name: meshbot-raspberry-pi
          path: ./dist/raspberry-pi/*
      - name: Upload MacOS Intel binary
        uses: actions/upload-artifact@v4
        with:
          name: meshbot-macos-intel
          path: ./dist/macos-intel/*
      - name: Upload MacOS Apple Silicon binary
        uses: actions/upload-artifact@v4
        with:
          name: meshbot-macos-apple-silicon
          path: ./dist/macos-apple-silicon/*
      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: meshbot-docker-image
          path: ./dist/docker/*
